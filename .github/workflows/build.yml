name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
          - os: macos-latest
            rid: osx-arm64
            name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: RandomChooser.csproj

      - name: Restore
        run: dotnet restore RandomChooser.csproj

      - name: Publish
        shell: bash
        run: |
          dotnet publish RandomChooser.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "publish/${{ matrix.name }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Force `
            -Path "publish/${{ matrix.name }}/RandomChooser.exe" `
            -DestinationPath "artifacts/RandomChooser-${{ matrix.name }}.zip"

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/RandomChooser-${{ matrix.name }}.tar.gz" \
            -C "publish/${{ matrix.name }}" RandomChooser

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandomChooser-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            RandomChooser.csproj
            tests/RandomChooser.Tests/RandomChooser.Tests.csproj

      - name: Restore
        run: dotnet restore tests/RandomChooser.Tests/RandomChooser.Tests.csproj

      - name: Test
        run: dotnet test tests/RandomChooser.Tests/RandomChooser.Tests.csproj --nologo

  release:
    name: Publish GitHub Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
